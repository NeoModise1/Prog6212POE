name: Raceday Database CI

on:
push:
branches:
- main
- develop

pull_request:
branches:
- main
- develop

jobs:
database-test:
name: Test Raceday Database
runs-on: ubuntu-latest

steps:
- name: Checkout Repository
uses: actions/checkout@v4

- name: Install SQL Server Tools
run: |
curl -sSL -O https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
sudo dpkg -i packages-microsoft-prod.deb
sudo apt-get update
sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev

- name: Start SQL Server
run: |
docker run -d \
--name raceday-sqlserver \
-e ACCEPT_EULA=Y \
-e MSSQL_SA_PASSWORD='Raceday@12345' \
-p 1433:1433 \
mcr.microsoft.com/mssql/server:2022-latest

- name: Wait for SQL Server
run: |
echo "Waiting for SQL Server..."

for i in {1..30}; do
if /opt/mssql-tools18/bin/sqlcmd \
-S localhost,1433 \
-U sa \
-P 'Raceday@12345' \
-C \
-Q "SELECT 1" > /dev/null 2>&1
then
echo "SQL Server is ready."
break
fi

sleep 5
done

- name: Create Raceday Database
run: |
/opt/mssql-tools18/bin/sqlcmd \
-S localhost,1433 \
-U sa \
-P 'Raceday@12345' \
-C \
-Q "CREATE DATABASE RacedayDB"

- name: Run Database Schema
run: |
/opt/mssql-tools18/bin/sqlcmd \
-S localhost,1433 \
-U sa \
-P 'Raceday@12345' \
-C \
-d RacedayDB \
-i database/schema.sql

- name: Insert Test Data
run: |
/opt/mssql-tools18/bin/sqlcmd \
-S localhost,1433 \
-U sa \
-P 'Raceday@12345' \
-C \
-d RacedayDB \
-i database/data.sql

- name: Run SQL Queries
run: |
/opt/mssql-tools18/bin/sqlcmd \
-S localhost,1433 \
-U sa \
-P 'Raceday@12345' \
-C \
-d RacedayDB \
-i database/queries.sql

- name: Database Test Successful
run: |
echo "Raceday database workflow completed successfully."
