name: Raceday Database CI

on:
push:
branches:
- master
pull_request:
branches:
- master

jobs:
database-test:
name: Test Raceday Database
runs-on: ubuntu-latest

services:
sqlserver:
image: mcr.microsoft.com/mssql/server:2022-latest
env:
ACCEPT_EULA: "Y"
MSSQL_SA_PASSWORD: "Raceday@12345"
ports:
- 1433:1433

steps:
- name: Checkout Repository
uses: actions/checkout@v4

- name: Install SQLCMD
run: |
curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
curl https://packages.microsoft.com/config/ubuntu/24.04/prod.list | sudo tee /etc/apt/sources.list.d/msprod.list
sudo apt-get update
sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev

- name: Wait for SQL Server
run: |
echo "Waiting for SQL Server..."

for i in {1..30}
do
if /opt/mssql-tools18/bin/sqlcmd \
-S localhost,1433 \
-U sa \
-P 'Raceday@12345' \
-C \
-Q "SELECT 1"
then
echo "SQL Server is ready."
break
fi

echo "SQL Server is not ready yet..."
sleep 5
done

- name: Create RaceWays Database
run: |
/opt/mssql-tools18/bin/sqlcmd \
-S localhost,1433 \
-U sa \
-P 'Raceday@12345' \
-C \
-Q "IF DB_ID('RaceWays') IS NULL CREATE DATABASE RaceWays"

- name: Create Tables
run: |
/opt/mssql-tools18/bin/sqlcmd \
-S localhost,1433 \
-U sa \
-P 'Raceday@12345' \
-C \
-d RaceWays \
-i "database/creating table.sql"

/opt/mssql-tools18/bin/sqlcmd \
-S localhost,1433 \
-U sa \
-P 'Raceday@12345' \
-C \
-d RaceWays \
-i "database/creating categories table.sql"

/opt/mssql-tools18/bin/sqlcmd \
-S localhost,1433 \
-U sa \
-P 'Raceday@12345' \
-C \
-d RaceWays \
-i "database/creating events table.sql"

/opt/mssql-tools18/bin/sqlcmd \
-S localhost,1433 \
-U sa \
-P 'Raceday@12345' \
-C \
-d RaceWays \
-i "database/creating event categories table.sql"

/opt/mssql-tools18/bin/sqlcmd \
-S localhost,1433 \
-U sa \
-P 'Raceday@12345' \
-C \
-d RaceWays \
-i "database/creating user_events table.sql"

/opt/mssql-tools18/bin/sqlcmd \
-S localhost,1433 \
-U sa \
-P 'Raceday@12345' \
-C \
-d RaceWays \
-i "database/creating routes table.sql"

/opt/mssql-tools18/bin/sqlcmd \
-S localhost,1433 \
-U sa \
-P 'Raceday@12345' \
-C \
-d RaceWays \
-i "database/creating weather information table.sql"

/opt/mssql-tools18/bin/sqlcmd \
-S localhost,1433 \
-U sa \
-P 'Raceday@12345' \
-C \
-d RaceWays \
-i "database/creating results table.sql"

- name: Insert Data
run: |
/opt/mssql-tools18/bin/sqlcmd \
-S localhost,1433 \
-U sa \
-P 'Raceday@12345' \
-C \
-d RaceWays \
-i "database/inserting values.sql"

/opt/mssql-tools18/bin/sqlcmd \
-S localhost,1433 \
-U sa \
-P 'Raceday@12345' \
-C \
-d RaceWays \
-i "database/inserting values 2.sql"

/opt/mssql-tools18/bin/sqlcmd \
-S localhost,1433 \
-U sa \
-P 'Raceday@12345' \
-C \
-d RaceWays \
-i "database/inserting values 3.sql"

/opt/mssql-tools18/bin/sqlcmd \
-S localhost,1433 \
-U sa \
-P 'Raceday@12345' \
-C \
-d RaceWays \
-i "database/inserting values 4.sql"

/opt/mssql-tools18/bin/sqlcmd \
-S localhost,1433 \
-U sa \
-P 'Raceday@12345' \
-C \
-d RaceWays \
-i "database/inserting values 5.sql"

/opt/mssql-tools18/bin/sqlcmd \
-S localhost,1433 \
-U sa \
-P 'Raceday@12345' \
-C \
-d RaceWays \
-i "database/inserting values 6.sql"

/opt/mssql-tools18/bin/sqlcmd \
-S localhost,1433 \
-U sa \
-P 'Raceday@12345' \
-C \
-d RaceWays \
-i "database/inserting values 7.sql"

- name: Test Database
run: |
/opt/mssql-tools18/bin/sqlcmd \
-S localhost,1433 \
-U sa \
-P 'Raceday@12345' \
-C \
-d RaceWays \
-i "database/Testing Databases.sql"

- name: Test Tables
run: |
/opt/mssql-tools18/bin/sqlcmd \
-S localhost,1433 \
-U sa \
-P 'Raceday@12345' \
-C \
-d RaceWays \
-i "database/Testing the Tables.sql"

- name: Database Test Successful
run: |
echo "Raceday Database CI completed successfully."
