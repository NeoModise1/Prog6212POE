
name: Raceday Database CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  database-test:
    name: Test Raceday Database
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Raceday@12345"
        ports:
          - 1433:1433

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install SQLCMD
        shell: bash
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | \
          sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg

          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/22.04/prod jammy main" | \
          sudo tee /etc/apt/sources.list.d/microsoft-prod.list

          sudo apt-get update

          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev

          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      - name: Wait for SQL Server
        shell: bash
        run: |
          echo "Waiting for SQL Server..."

          for i in {1..60}
          do
            if sqlcmd \
              -S localhost,1433 \
              -U sa \
              -P 'Raceday@12345' \
              -C \
              -Q "SELECT 1" \
              -b
            then
              echo "SQL Server is ready."
              exit 0
            fi

            echo "SQL Server is not ready yet..."
            sleep 5
          done

          echo "SQL Server failed to start."
          exit 1

      - name: Create RaceWays Database
        shell: bash
        run: |
          sqlcmd \
            -S localhost,1433 \
            -U sa \
            -P 'Raceday@12345' \
            -C \
            -Q "IF DB_ID('RaceWays') IS NULL CREATE DATABASE RaceWays" \
            -b

      - name: Create USERS Table
        shell: bash
        run: |
          sqlcmd \
            -S localhost,1433 \
            -U sa \
            -P 'Raceday@12345' \
            -C \
            -d RaceWays \
            -i "database/creating table.sql" \
            -b

      - name: Create CATEGORIES Table
        shell: bash
        run: |
          sqlcmd \
            -S localhost,1433 \
            -U sa \
            -P 'Raceday@12345' \
            -C \
            -d RaceWays \
            -i "database/creating categories table.sql" \
            -b

      - name: Create EVENTS Table
        shell: bash
        run: |
          sqlcmd \
            -S localhost,1433 \
            -U sa \
            -P 'Raceday@12345' \
            -C \
            -d RaceWays \
            -i "database/creating event categories table.sql" \
            -b

      - name: Create USER_EVENTS Table
        shell: bash
        run: |
          sqlcmd \
            -S localhost,1433 \
            -U sa \
            -P 'Raceday@12345' \
            -C \
            -d RaceWays \
            -i "database/creating events table.sql" \
            -b

      - name: Create EVENT_CATEGORIES Table
        shell: bash
        run: |
          sqlcmd \
            -S localhost,1433 \
            -U sa \
            -P 'Raceday@12345' \
            -C \
            -d RaceWays \
            -i "database/creating user_events table.sql" \
            -b

      - name: Create ENROLLMENTS Table
        shell: bash
        run: |
          sqlcmd \
            -S localhost,1433 \
            -U sa \
            -P 'Raceday@12345' \
            -C \
            -d RaceWays \
            -i "database/creating results table.sql" \
            -b

      - name: Create RESULTS Table
        shell: bash
        run: |
          sqlcmd \
            -S localhost,1433 \
            -U sa \
            -P 'Raceday@12345' \
            -C \
            -d RaceWays \
            -i "database/creating routes table.sql" \
            -b

      - name: Create ROUTES Table
        shell: bash
        run: |
          sqlcmd \
            -S localhost,1433 \
            -U sa \
            -P 'Raceday@12345' \
            -C \
            -d RaceWays \
            -i "database/creating weather information table.sql" \
            -b

      - name: Create WEATHER_INFORMATION Table
        shell: bash
        run: |
          sqlcmd \
            -S localhost,1433 \
            -U sa \
            -P 'Raceday@12345' \
            -C \
            -d RaceWays \
            -i "database/inserting values 7.sql" \
            -b

      - name: Verify Database Tables
        shell: bash
        run: |
          sqlcmd \
            -S localhost,1433 \
            -U sa \
            -P 'Raceday@12345' \
            -C \
            -d RaceWays \
            -Q "
              SELECT TABLE_NAME
              FROM INFORMATION_SCHEMA.TABLES
              WHERE TABLE_TYPE = 'BASE TABLE'
              ORDER BY TABLE_NAME;
            " \
            -b

      - name: Insert Database Data
        shell: bash
        run: |
          sqlcmd \
            -S localhost,1433 \
            -U sa \
            -P 'Raceday@12345' \
            -C \
            -d RaceWays \
            -i "database/inserting values.sql" \
            -b

      - name: Verify Data
        shell: bash
        run: |
          sqlcmd \
            -S localhost,1433 \
            -U sa \
            -P 'Raceday@12345' \
            -C \
            -d RaceWays \
            -Q "
              SELECT 'USERS' AS TableName, COUNT(*) AS RowCount FROM dbo.USERS
              UNION ALL
              SELECT 'EVENTS', COUNT(*) FROM dbo.EVENTS
              UNION ALL
              SELECT 'CATEGORIES', COUNT(*) FROM dbo.CATEGORIES
              UNION ALL
              SELECT 'USER_EVENTS', COUNT(*) FROM dbo.USER_EVENTS
              UNION ALL
              SELECT 'EVENT_CATEGORIES', COUNT(*) FROM dbo.EVENT_CATEGORIES
              UNION ALL
              SELECT 'ENROLLMENTS', COUNT(*) FROM dbo.ENROLLMENTS
              UNION ALL
              SELECT 'RESULTS', COUNT(*) FROM dbo.RESULTS
              UNION ALL
              SELECT 'ROUTES', COUNT(*) FROM dbo.ROUTES
              UNION ALL
              SELECT 'WEATHER_INFORMATION', COUNT(*) FROM dbo.WEATHER_INFORMATION;
            " \
            -b

      - name: Test Database
        shell: bash
        run: |
          sqlcmd \
            -S localhost,1433 \
            -U sa \
            -P 'Raceday@12345' \
            -C \
            -d RaceWays \
            -i "database/Testing Databases.sql" \
            -b

      - name: Test Tables
        shell: bash
        run: |
          sqlcmd \
            -S localhost,1433 \
            -U sa \
            -P 'Raceday@12345' \
            -C \
            -d RaceWays \
            -i "database/Testing the Tables.sql" \
            -b

      - name: Database Test Successful
        shell: bash
        run: |
          echo "=========================================="
          echo "Raceday Database CI completed successfully."
          echo "Database creation: PASSED"
          echo "Data insertion: PASSED"
          echo "Database tests: PASSED"
          echo "Table tests: PASSED"
          echo "=========================================="
